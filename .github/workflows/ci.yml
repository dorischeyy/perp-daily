name: CI

# Check script syntax, unit tests, and a sample edition before deployment.
# Pushes that change only published pages skip this job.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check library syntax
        run: for f in lib/*.mjs; do node --check "$f" || exit 1; done
      - name: Run unit tests
        run: npm test
      - name: Validate and render the sample edition
        run: |
          node lib/validate-content.mjs config/content.sample.json
          node lib/check-freshness.mjs config/content.sample.json 2026-06-20
          node lib/threads.mjs
          node lib/build-html.mjs config/content.sample.json /tmp/out.html
          test -s /tmp/out.html
