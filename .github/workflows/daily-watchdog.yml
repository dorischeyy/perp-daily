name: Daily Watchdog (recovery)

# Check the published edition after the expected release time.
# Dispatch the fallback only when today's edition is missing.
# Poll for the published result and fail this job if recovery times out.
# Operational alerts are handled by GitHub. Report channels receive editions.
on:
  schedule:
    - cron: '30 1 * * *'   # 01:30 UTC is 09:30 in Beijing.
  workflow_dispatch: {}

concurrency:
  group: watchdog
  cancel-in-progress: false

permissions:
  contents: read
  actions: write           # Required to dispatch the fallback workflow.

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check today's edition and dispatch recovery if missing
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%F)
          LATEST=$(node -e "try{console.log(require('./docs/latest.json').date||'')}catch(e){console.log('')}")
          echo "Beijing date=$TODAY, latest.json.date=$LATEST"
          if [ "$LATEST" = "$TODAY" ]; then
            echo "Today's edition is published."
            exit 0
          fi

          echo "Missing edition for $TODAY (latest=$LATEST). Dispatching recovery."
          gh workflow run daily-report.yml --ref main

          echo "Recovery dispatched. Checking for the edition for up to 15 minutes."
          for i in $(seq 1 15); do
            sleep 60
            git fetch -q origin main || true
            NEW=$(git show origin/main:docs/latest.json 2>/dev/null \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).date||'')}catch(e){console.log('')}})")
            echo "  Check ${i}/15: latest=$NEW"
            if [ "$NEW" = "$TODAY" ]; then
              echo "Recovery published today's edition."
              exit 0
            fi
          done

          echo "::error::The edition for $TODAY is still missing after 15 minutes. Check the latest daily-report workflow logs."
          exit 1
