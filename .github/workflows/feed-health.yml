name: Feed Health

# Check the configured RSS feeds weekly for availability and recent entries.
# A failed job reports stale or unreachable feeds through GitHub.
# Keep operational alerts out of the report delivery channels.
on:
  schedule:
    - cron: '0 1 * * 1'    # Monday, 09:00 in Beijing.
  workflow_dispatch: {}

concurrency:
  group: feed-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check RSS feed availability and freshness
        run: node lib/check-feeds.mjs
