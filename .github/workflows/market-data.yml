name: Market Data Snapshot

# Fetch a public CoinGecko snapshot on a GitHub runner before the edition.
# The research run reads docs/market.json and checks its timestamp.
on:
  schedule:
    - cron: '30 23 * * *'   # 23:30 UTC is 07:30 in Beijing.
  workflow_dispatch: {}

concurrency:
  group: market-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch the CoinGecko snapshot
        run: node lib/fetch-data.mjs docs/market.json
      - name: Commit the snapshot if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/market.json
          if git diff --cached --quiet; then echo "Snapshot unchanged"; exit 0; fi
          git commit -m "data: market snapshot $(TZ=Asia/Shanghai date +%F)"
          git pull --rebase -q origin main || true
          git push
