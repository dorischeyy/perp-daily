name: Notify (Feishu + Slack)

# Deliver the published summary to enabled channels from a GitHub runner.
# channels.json names the relevant webhook environment variables.
# Store webhook values in repository secrets.
#
# Deliver a new report commit or an explicit manual dispatch.
# Other changes to the latest index must not send a duplicate card.
on:
  push:
    branches: [main]
    paths:
      - 'docs/latest.json'
  workflow_dispatch: {}   # Manual dispatch explicitly requests redelivery.

# Serialize deliveries to prevent concurrent duplicates.
concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this event should deliver an edition
        id: gate
        env:
          MSG: ${{ github.event.head_commit.message }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual delivery requested"; echo "go=1" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$MSG" | head -1 | grep -qE '^report:'; then
            echo "New report commit"; echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping duplicate delivery for a non-report commit ($(printf '%s' "$MSG" | head -1))"; echo "go=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Send cards via deliver.mjs (Feishu + Slack)
        if: steps.gate.outputs.go == '1'
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -z "$FEISHU_WEBHOOK" ] && [ -z "$SLACK_WEBHOOK" ]; then
            echo "::error::Neither FEISHU_WEBHOOK nor SLACK_WEBHOOK is configured"; exit 1
          fi
          [ -z "$SLACK_WEBHOOK" ] && echo "::warning::SLACK_WEBHOOK is unset. Skipping Slack."
          [ -z "$FEISHU_WEBHOOK" ] && echo "::warning::FEISHU_WEBHOOK is unset. Skipping Feishu."
          TITLE=$(node -e "console.log(require('./docs/latest.json').title)")
          URL=$(node -e "console.log(require('./docs/latest.json').url)")
          LEAD=$(node -e "console.log(require('./docs/latest.json').lead)")
          echo "Sending $TITLE -> $URL"
          node lib/deliver.mjs "$TITLE" "$URL" "$LEAD"
