name: Legacy Daily Report (manual fallback)

# Manual fallback that generates the edition on a GitHub runner.
# Claude prepares the inputs and publish.sh validates, renders, and publishes them.
# The fallback delivers Feishu and Slack summaries inline because a GITHUB_TOKEN
# push does not trigger a second workflow. Use feishu-notify.yml for manual redelivery.

on:
  workflow_dispatch: {}        # Manual recovery after migration to the scheduled Codex run.

concurrency:
  group: daily-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Set the author and committer identity in the environment so the action
      # retains the repository owner's attribution even if it changes Git configuration.
      GIT_AUTHOR_NAME: dorischeyy
      GIT_AUTHOR_EMAIL: dorischeyy@users.noreply.github.com
      GIT_COMMITTER_NAME: dorischeyy
      GIT_COMMITTER_EMAIL: dorischeyy@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # The fallback fetches and rebases on origin/main.

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine the edition date in Beijing
        id: meta
        run: echo "d=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - name: Check whether today's edition has already been published
        id: guard
        run: |
          if [ -f docs/latest.json ] && [ "$(node -e "console.log(require('./docs/latest.json').date)")" = "${{ steps.meta.outputs.d }}" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "The edition for ${{ steps.meta.outputs.d }} is already published. Skipping generation and delivery."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate content, ledger, and editorial review
        if: steps.guard.outputs.published != 'true'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true    # Retain output to diagnose incomplete runs.
          prompt: |
            You are the editor of Perp DEX Daily. Write the daily report, its editorial review, and new story ledger entries in Simplified Chinese. Use ${{ steps.meta.outputs.d }} as the authoritative Beijing date for content.json.
            Follow generate.md. Read config/sources.json, docs/market.json, threads.json and recent editions. Use WebSearch and WebFetch to research the stories and verify the publication date on each source page. Apply the scoring, freshness, provenance and story continuity rules, including the 72-hour limit for standalone news.
            Write content.json, threads.json and review.draft.md at the repository root. Run node lib/threads.mjs to validate the updated ledger.
            Finish after writing these three files. The following workflow steps handle validation, rendering, Git publication and delivery. Do not run publish.sh or git add, commit or push.
            Complete the work in this run using search, source reads and file operations. Do not delegate to Agent, Task or background jobs. Confirm all three artifacts exist on disk before ending the turn.
          claude_args: '--permission-mode bypassPermissions --model sonnet --disallowedTools "Agent,Task"'

      - name: Upload the execution log for diagnostics
        if: always() && steps.guard.outputs.published != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-log
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: warn

      - name: Validate, render, and publish the edition
        if: steps.guard.outputs.published != 'true'
        run: bash publish.sh

      - name: Deliver Feishu and Slack summaries
        if: steps.guard.outputs.published != 'true'
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -z "$FEISHU_WEBHOOK" ] && [ -z "$SLACK_WEBHOOK" ]; then
            echo "::error::Neither FEISHU_WEBHOOK nor SLACK_WEBHOOK is configured"; exit 1
          fi
          TITLE=$(node -e "console.log(require('./docs/latest.json').title)")
          URL=$(node -e "console.log(require('./docs/latest.json').url)")
          LEAD=$(node -e "console.log(require('./docs/latest.json').lead)")
          echo "Delivering $TITLE -> $URL"
          node lib/deliver.mjs "$TITLE" "$URL" "$LEAD"
